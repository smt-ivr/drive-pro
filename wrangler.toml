name = "drive-pro"
main = "src/index.js"
compatibility_date = "2025-06-01"

# Served at https://smti.uk/drive-pro/api/* (route is configured in the Cloudflare dashboard).

[observability]
enabled = true

[vars]
GOOGLE_CLIENT_ID = "1051411859059-ejo6a7g8aee7e9i45h569a66otg8ru9j.apps.googleusercontent.com"
GOOGLE_REDIRECT_URI = "https://smti.uk/drive-pro/api/auth-callback"
# Comma separated list of web origins allowed to call the API and to receive OAuth tokens.
ALLOWED_ORIGINS = "https://smti.uk"
# Name of the top-level folder created in the user's My Drive.
ROOT_FOLDER_NAME = "Drive Pro"

# Secrets (set with `npx wrangler secret put <NAME>`, never commit them):
#   GOOGLE_CLIENT_SECRET  – required
#   STATE_SECRET          – optional, signs the OAuth state (falls back to GOOGLE_CLIENT_SECRET)

[[d1_databases]]
binding = "DB"
database_name = "drive-pro"
database_id = "2dee5e98-bf06-4aa3-991d-129ef43b1cc1"
migrations_dir = "migrations"
